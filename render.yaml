# Render blueprint for the API. The frontend goes to Vercel; see
# docs/DEPLOYMENT.md.
#
# Render builds the Dockerfile, which migrates and seeds on start-up, so a
# fresh instance comes up with data in it rather than an empty database.

services:
  - type: web
    name: salary-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/salary.db

      # Render generates this on first deploy. Copy the value into the
      # frontend's API_KEY on Vercel -- the two have to match, and the
      # service refuses to start in production without it.
      - key: API_KEY
        generateValue: true

      # The browser reaches the API through the frontend's own origin, so the
      # API never needs to answer a cross-origin request. Left empty on
      # purpose: anything listed here would be a permission nobody uses.
      - key: CORS_ORIGINS
        value: ""

    # A free instance has no persistent disk, so /data is wiped on every
    # restart and the start-up seed refills it. To keep writes between
    # restarts, move to a paid instance and uncomment this.
    #
    # disk:
    #   name: salary-data
    #   mountPath: /data
    #   sizeGB: 1
